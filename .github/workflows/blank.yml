name: Build GlipsFlow 0.1.1alpha APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate GlipsFlow source
        shell: bash
        run: |
          set -euo pipefail
          if [ -f app/build.gradle ] && [ -f settings.gradle ]; then
            echo 'PROJECT_DIR=.' >> "$GITHUB_ENV"
          elif [ -f GalleryFlow_Project.zip ]; then
            mkdir -p _glipsflow_source
            unzip -q GalleryFlow_Project.zip -d _glipsflow_source
            test -f _glipsflow_source/app/build.gradle || { echo 'ZIP missing app/build.gradle'; exit 1; }
            test -f _glipsflow_source/settings.gradle || { echo 'ZIP missing settings.gradle'; exit 1; }
            echo 'PROJECT_DIR=_glipsflow_source' >> "$GITHUB_ENV"
          else
            echo 'ERROR: Upload GalleryFlow_Project.zip to the root of this repository.'
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile debug APK
        run: gradle --no-daemon --stacktrace -p "$PROJECT_DIR" :app:assembleDebug

      - name: Save GlipsFlow APK
        uses: actions/upload-artifact@v4
        with:
          name: GlipsFlow-0.1.1alpha-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
